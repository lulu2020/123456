name: Remove known temporary relay artifacts

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cleanup-known-artifacts-now.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete known temporary artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for id in \
            12562239357 \
            12563110329 \
            12563015675 \
            12562553253 \
            12562453731 \
            12564483186 \
            12564354662
          do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id")
            if [ "$code" = "204" ] || [ "$code" = "404" ]; then
              echo "artifact $id removed/already absent"
            else
              echo "artifact $id delete failed: HTTP $code"
              exit 1
            fi
          done
