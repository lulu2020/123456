name: Publish ESP-IDF 6.1 P4 Offline Toolchain

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-idf61-p4-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download prepared tool bundle
        uses: actions/download-artifact@v4
        with:
          name: idf-p4-v6.1-linux-x86_64
          path: inbound
          github-token: ${{ github.token }}
          repository: lulu2020/123456
          run-id: 40100400145

      - name: Verify bundle
        shell: bash
        run: |
          set -euxo pipefail
          cd inbound
          sha256sum -c idf-p4-v6.1-linux-x86_64.tar.zst.sha256
          mv idf-p4-v6.1-linux-x86_64.tar.zst ../esp-idf-6.1-esp32p4-offline.tar.zst
          cd ..
          sed 's#idf-p4-v6.1-linux-x86_64.tar.zst#esp-idf-6.1-esp32p4-offline.tar.zst#' \
            inbound/idf-p4-v6.1-linux-x86_64.tar.zst.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Create restore helper
        shell: bash
        run: |
          cat > restore-idf61-p4.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          ARCHIVE="${1:-esp-idf-6.1-esp32p4-offline.tar.zst}"
          DEST="${2:-/opt/espressif-local}"

          test -f "$ARCHIVE"
          mkdir -p "$DEST"
          tar --zstd -xf "$ARCHIVE" -C "$DEST"

          python3 - "$DEST" <<'PY'
          import json, sys
          from pathlib import Path
          dest = Path(sys.argv[1]).resolve()
          tools = dest / '.espressif'
          idf = dest / 'esp-idf-v6.1'
          env = {
              'idfInstalled': {
                  str(dest / 'esp-idf-v6.1-v6.1'): {
                      'version': '6.1',
                      'path': str(idf),
                      'features': ['core'],
                      'targets': ['esp32p4'],
                  }
              }
          }
          (tools / 'idf-env.json').write_text(json.dumps(env, indent=4) + '\n', encoding='utf-8')
          PY

          GDB_BIN="$DEST/.espressif/tools/riscv32-esp-elf-gdb/17.1_20260402/riscv32-esp-elf-gdb/bin"
          if [ -x "$GDB_BIN/riscv32-esp-elf-gdb-3.13" ]; then
              ln -sfn riscv32-esp-elf-gdb-3.13 "$GDB_BIN/riscv32-esp-elf-gdb"
          fi

          cat > "$DEST/idf61-p4-env.sh" <<EOF2
          #!/usr/bin/env bash
          export IDF_TOOLS_PATH="$DEST/.espressif"
          export IDF_PATH_FORCE=1
          . "$DEST/esp-idf-v6.1/export.sh"
          EOF2
          chmod +x "$DEST/idf61-p4-env.sh"

          bash -lc "source '$DEST/idf61-p4-env.sh' >/dev/null && idf.py --version && riscv32-esp-elf-gcc --version | head -n1 && riscv32-esp-elf-gdb --version | head -n1 && openocd --version | head -n1"

          echo
          echo "Installed. Activate with:"
          echo "  source $DEST/idf61-p4-env.sh"
          EOF
          chmod +x restore-idf61-p4.sh

      - name: Prepare release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # ESP-IDF 6.1 / ESP32-P4 Offline Toolchain

          Reusable offline Linux x86_64 build environment for ESP32-P4.

          Verified baseline:
          - ESP-IDF v6.1.0
          - target: ESP32-P4
          - riscv32-esp-elf GCC 15.2.0
          - riscv32-esp-elf GDB 17.1
          - OpenOCD 0.12.0-esp32
          - esptool 5.6.0

          Assets:
          - `esp-idf-6.1-esp32p4-offline.tar.zst`
          - `SHA256SUMS`
          - `restore-idf61-p4.sh`

          The archive contains only Espressif/Open Source build tooling and dependencies. It does not contain Niuma project source or firmware.

          Default restore path:
          ```bash
          bash restore-idf61-p4.sh esp-idf-6.1-esp32p4-offline.tar.zst /opt/espressif-local
          source /opt/espressif-local/idf61-p4-env.sh
          ```
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          gh release create toolchain-esp-idf-v6.1-p4 \
            esp-idf-6.1-esp32p4-offline.tar.zst \
            SHA256SUMS \
            restore-idf61-p4.sh \
            --repo "$GITHUB_REPOSITORY" \
            --title 'ESP-IDF 6.1 / ESP32-P4 Offline Toolchain' \
            --notes-file RELEASE_NOTES.md \
            --target "$GITHUB_SHA"
