name: ESP-IDF 6.1 P4 Tool Relay Split

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  split-relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download previously prepared official tool bundle
        uses: actions/download-artifact@v4
        with:
          name: idf-p4-v6.1-linux-x86_64
          path: inbound
          github-token: ${{ github.token }}
          repository: lulu2020/123456
          run-id: 40100400145

      - name: Verify and split below connector limit
        shell: bash
        run: |
          set -euxo pipefail
          cd inbound
          sha256sum -c idf-p4-v6.1-linux-x86_64.tar.zst.sha256
          split -b 400M -d -a 2 \
            idf-p4-v6.1-linux-x86_64.tar.zst \
            ../idf-p4-v6.1-linux-x86_64.part-
          cd ..
          ls -lh idf-p4-v6.1-linux-x86_64.part-*
          test "$(find . -maxdepth 1 -name 'idf-p4-v6.1-linux-x86_64.part-*' | wc -l)" -eq 4
          cp inbound/idf-p4-v6.1-linux-x86_64.tar.zst.sha256 .

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: idf-p4-v6.1-part00
          path: |
            idf-p4-v6.1-linux-x86_64.part-00
            idf-p4-v6.1-linux-x86_64.tar.zst.sha256
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: idf-p4-v6.1-part01
          path: idf-p4-v6.1-linux-x86_64.part-01
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: idf-p4-v6.1-part02
          path: idf-p4-v6.1-linux-x86_64.part-02
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: idf-p4-v6.1-part03
          path: idf-p4-v6.1-linux-x86_64.part-03
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
