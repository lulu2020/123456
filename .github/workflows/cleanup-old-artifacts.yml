name: Cleanup old Actions artifacts

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete artifacts older than 24 hours
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json, os, re, urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          api = os.environ.get('GITHUB_API_URL', 'https://api.github.com')
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'niuma-artifact-cleaner',
          }

          def req(url, method='GET'):
              r = urllib.request.Request(url, headers=headers, method=method)
              return urllib.request.urlopen(r, timeout=30)

          artifacts = []
          url = f'{api}/repos/{repo}/actions/artifacts?per_page=100'
          while url:
              with req(url) as r:
                  data = json.load(r)
                  artifacts.extend(data.get('artifacts', []))
                  link = r.headers.get('Link', '')
              m = re.search(r'<([^>]+)>; rel="next"', link)
              url = m.group(1) if m else None

          cutoff = dt.datetime.now(dt.timezone.utc) - dt.timedelta(hours=24)
          deleted = 0
          kept = 0
          for a in artifacts:
              created = dt.datetime.fromisoformat(a['created_at'].replace('Z', '+00:00'))
              if a.get('expired') or created < cutoff:
                  with req(f"{api}/repos/{repo}/actions/artifacts/{a['id']}", 'DELETE') as r:
                      r.read()
                  deleted += 1
                  print('DELETED', a['id'], a['name'], a['created_at'])
              else:
                  kept += 1
          print(f'cleanup complete: deleted={deleted} kept_recent={kept}')
          PY
